<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160" viewBox="0 0 200 160">
  <!--
    Organic wave pattern — saree pallu / fabric drape inspiration
    Soft flowing curves, continuously repeating, textile-feel
    Uses currentColor so CSS mask-based tinting works
    Tileable: left/right edges match, top/bottom edges match
  -->

  <!-- Wave band 1 — gentle wide drape -->
  <path
    d="M -10 30
       C 20 18, 50 42, 100 28
       C 150 14, 180 38, 210 26"
    fill="none" stroke="currentColor" stroke-width="1.1"
    stroke-linecap="round" opacity="0.9"
  />

  <!-- Wave band 1b — shadow echo, slightly offset -->
  <path
    d="M -10 36
       C 20 24, 50 48, 100 34
       C 150 20, 180 44, 210 32"
    fill="none" stroke="currentColor" stroke-width="0.45"
    stroke-linecap="round" opacity="0.4"
  />

  <!-- Wave band 2 — tighter crinkle mid-section -->
  <path
    d="M -10 65
       C 15 52, 35 78, 65 62
       C 95 46, 115 72, 140 58
       C 165 44, 185 68, 210 55"
    fill="none" stroke="currentColor" stroke-width="0.9"
    stroke-linecap="round" opacity="0.85"
  />

  <!-- Wave band 2b — delicate parallel -->
  <path
    d="M -10 71
       C 15 58, 35 84, 65 68
       C 95 52, 115 78, 140 64
       C 165 50, 185 74, 210 61"
    fill="none" stroke="currentColor" stroke-width="0.35"
    stroke-linecap="round" opacity="0.35"
  />

  <!-- Wave band 3 — broad slow drape -->
  <path
    d="M -10 102
       C 30 88, 70 116, 100 100
       C 130 84, 170 112, 210 96"
    fill="none" stroke="currentColor" stroke-width="1.1"
    stroke-linecap="round" opacity="0.9"
  />

  <!-- Wave band 3b — fine shadow -->
  <path
    d="M -10 108
       C 30 94, 70 122, 100 106
       C 130 90, 170 118, 210 102"
    fill="none" stroke="currentColor" stroke-width="0.4"
    stroke-linecap="round" opacity="0.38"
  />

  <!-- Wave band 4 — near bottom, completes the tile -->
  <path
    d="M -10 138
       C 18 126, 45 150, 80 136
       C 115 122, 145 148, 175 134
       C 190 127, 200 130, 210 128"
    fill="none" stroke="currentColor" stroke-width="0.85"
    stroke-linecap="round" opacity="0.8"
  />

  <!-- Wave band 4b — echo -->
  <path
    d="M -10 143
       C 18 131, 45 155, 80 141
       C 115 127, 145 153, 175 139
       C 190 132, 200 135, 210 133"
    fill="none" stroke="currentColor" stroke-width="0.32"
    stroke-linecap="round" opacity="0.32"
  />

  <!-- Delicate cross-ripple: subtle diagonal accent lines (thread-like) -->
  <path
    d="M 48 0 C 44 20, 52 40, 48 60 C 44 80, 52 100, 48 120 C 44 140, 52 160, 48 160"
    fill="none" stroke="currentColor" stroke-width="0.28"
    stroke-linecap="round" opacity="0.22"
  />
  <path
    d="M 148 0 C 144 20, 152 40, 148 60 C 144 80, 152 100, 148 120 C 144 140, 152 160, 148 160"
    fill="none" stroke="currentColor" stroke-width="0.28"
    stroke-linecap="round" opacity="0.22"
  />

  <!-- Tiny accent dots at wave crests (embroidery bead feel) -->
  <circle cx="100" cy="28"  r="1.1" fill="currentColor" opacity="0.5" />
  <circle cx="65"  cy="62"  r="0.9" fill="currentColor" opacity="0.4" />
  <circle cx="140" cy="58"  r="0.9" fill="currentColor" opacity="0.4" />
  <circle cx="100" cy="100" r="1.1" fill="currentColor" opacity="0.5" />
  <circle cx="80"  cy="136" r="0.9" fill="currentColor" opacity="0.4" />
  <circle cx="175" cy="134" r="0.9" fill="currentColor" opacity="0.4" />
</svg>
